<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cek PWA • SalesPulse Area</title><style>body{font:16px system-ui;background:#0c1631;color:#eaf1ff;max-width:750px;margin:auto;padding:20px}h1{font-size:25px}.card{padding:14px;border-radius:13px;border:1px solid #344768;background:#1a2946;margin:10px 0}.ok{color:#4cddb3}.bad{color:#ff849b}.warning{color:#ffcb77}button,a{display:inline-block;margin:10px 8px 0 0;padding:12px;background:#6954ee;border:0;border-radius:10px;color:#fff;font:inherit;text-decoration:none}</style></head><body><h1>🔍 Cek Instalasi SalesPulse Area 12 Toko</h1><p>Gunakan URL aplikasi Area yang sama agar penyimpanan lokal HP tidak berubah; Cloud Supabase memerlukan konfigurasi tersendiri.</p><div id="checks"></div><button onclick="location.reload()">↻ Periksa Ulang</button><a href="./">Buka Dashboard</a><script>
(async()=>{const box=document.getElementById('checks');const show=(n,good,desc)=>{box.insertAdjacentHTML('beforeend',`<div class="card"><b class="${good?'ok':'bad'}">${good?'✅':'❌'} ${n}</b><br><small>${desc.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</small></div>`)};show('HTTPS',location.protocol==='https:','Alamat: '+location.href);for(const path of ['index.html','style.css','app.js','excel.js','cloud.js','supabase-config.js','supabase-rest.js','supabase-schema.sql','manifest.webmanifest','sw.js','icon-192.png','icon-512.png','icon-maskable-512.png','vendor/jszip.min.js']){try{const r=await fetch('./'+path,{cache:'no-store'});show(path,r.ok,'HTTP '+r.status+(r.headers.get('content-type')?' · '+r.headers.get('content-type'):''))}catch(e){show(path,false,e.message)}}try{const r=await fetch('./manifest.webmanifest',{cache:'no-store'});const j=await r.json();show('Manifest display',j.display==='standalone'||j.display==='fullscreen',`display=${j.display}; start_url=${j.start_url}; scope=${j.scope}; id=${j.id}`)}catch(e){show('Manifest JSON',false,e.message)}try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});show('Service Worker',!!reg,'Terdaftar: '+(reg.scope||''))}else show('Service Worker',false,'Browser tidak mendukung Service Worker')}catch(e){show('Service Worker',false,e.message)}})();</script></body></html>
